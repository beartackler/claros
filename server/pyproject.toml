[project]
name = "claros"
version = "0.1.0"
description = "Claros server: apprentice that captures expert judgment from screen work"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "pillow>=10",
    "fastmcp>=2.0",
    "rapidocr>=3.4",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
# heavy / local-only (torch, headless browser): `uv sync --extra local`. The cloud slim image omits these;
# every import is guarded and degrades (regex PII, LLM/regex rule extraction, Exa/Jina reads, greedy merge).
local = [
    "gliner2[local]",
    "crawl4ai",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claros"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
