[project]
name = "claros"
version = "0.1.0"
description = "Claros server: apprentice that captures expert judgment from screen work"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "pillow>=10",
    "instructor>=1.5",
    "openai>=1.40",
    "json-logic-qubit>=0.9",
    "fastmcp>=2.0",
    "rapidocr-onnxruntime>=1.3",
    "gliner2",
    "presidio-analyzer>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claros"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
