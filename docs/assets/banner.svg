<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Claros</title>
  <desc id="d">A voice apprentice that learns how your best people work and teaches it to the next person.</desc>
  <style>
    .ink { fill: #0b0b0f; }
    .word { font: 900 104px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -5px; fill: #0b0b0f; }
    .tag { font: 600 24px/1.3 "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #4a463e; }
    .who { font: 800 15px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; fill: #6d28d9; }
    .say { font: 700 25px/1.25 "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #0b0b0f; }
    .ring { fill: none; stroke: #6d28d9; stroke-width: 3; transform-origin: 160px 300px; animation: ring 3s ease-out infinite; opacity: 0; }
    .ring.r2 { animation-delay: 1s; } .ring.r3 { animation-delay: 2s; }
    @keyframes ring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.1); opacity: 0; } }
    .orb { transform-origin: 160px 300px; animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .bar { fill: #0b0b0f; transform-box: fill-box; transform-origin: center; animation: talk 1.1s ease-in-out infinite; }
    @keyframes talk { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
    .line { opacity: 0; animation: cycle 12s infinite; }
    .l2 { animation-delay: 4s; } .l3 { animation-delay: 8s; }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(8px); } 4% { opacity: 1; transform: translateY(0); }
      29% { opacity: 1; transform: translateY(0); } 33% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ring, .orb, .bar { animation: none; } .line { animation: none; } .l1 { opacity: 1; } }
  </style>

  <rect width="1280" height="400" fill="#fbf6ea"/>
  <!-- card with hard shadow -->
  <rect x="34" y="34" width="1220" height="340" rx="14" class="ink"/>
  <rect x="24" y="24" width="1220" height="340" rx="14" fill="#ffffff" stroke="#0b0b0f" stroke-width="4"/>

  <!-- orb -->
  <circle class="ring" cx="160" cy="300" r="34"/>
  <circle class="ring r2" cx="160" cy="300" r="34"/>
  <circle class="ring r3" cx="160" cy="300" r="34"/>
  <g class="orb">
    <circle cx="160" cy="300" r="36" fill="#6d28d9" stroke="#0b0b0f" stroke-width="4"/>
    <circle cx="148" cy="288" r="9" fill="#ede4ff"/>
  </g>
  <!-- voice bars -->
  <g transform="translate(220 284)">
    <rect class="bar" x="0" y="0" width="8" height="32" rx="3"/>
    <rect class="bar" x="16" y="0" width="8" height="32" rx="3" style="animation-delay:.15s"/>
    <rect class="bar" x="32" y="0" width="8" height="32" rx="3" style="animation-delay:.3s"/>
    <rect class="bar" x="48" y="0" width="8" height="32" rx="3" style="animation-delay:.45s"/>
    <rect class="bar" x="64" y="0" width="8" height="32" rx="3" style="animation-delay:.6s"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="88" y="150" class="word">claros</text>
  <text x="92" y="200" class="tag">The voice apprentice that learns how your best</text>
  <text x="92" y="232" class="tag">people work — and teaches it to the next person.</text>

  <!-- speech card -->
  <rect x="704" y="96" width="500" height="220" rx="12" class="ink"/>
  <rect x="696" y="88" width="500" height="220" rx="12" fill="#ede4ff" stroke="#0b0b0f" stroke-width="4"/>
  <path d="M716 308 L700 344 L752 308 Z" fill="#ede4ff" stroke="#0b0b0f" stroke-width="4" stroke-linejoin="round"/>
  <rect x="712" y="296" width="44" height="10" fill="#ede4ff"/>

  <g class="line l1">
    <text x="728" y="136" class="who">CLAROS · WATCHING THE EXPERT</text>
    <text x="728" y="186" class="say">“You moved that one to capex.</text>
    <text x="728" y="219" class="say">What made you do that?”</text>
  </g>
  <g class="line l2">
    <text x="728" y="136" class="who">CLAROS · DEBRIEF</text>
    <text x="728" y="186" class="say">“You held the December invoice.</text>
    <text x="728" y="219" class="say">Is that for every supplier?”</text>
  </g>
  <g class="line l3">
    <text x="728" y="136" class="who">CLAROS · TEACHING A NEW HIRE</text>
    <text x="728" y="186" class="say">“Anna would stop here.</text>
    <text x="728" y="219" class="say">Why do you think?”</text>
  </g>
</svg>
